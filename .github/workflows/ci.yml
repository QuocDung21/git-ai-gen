name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check full TUI
        run: cargo check

      - name: Check TUI library without default features
        run: cargo check --no-default-features -p git-ai

      - name: Check FFI bridge
        run: cargo check -p git-ai-ffi

      - name: Test
        run: cargo test

      - name: Clippy full TUI
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy TUI library without default features
        run: cargo clippy --no-default-features -p git-ai -- -D warnings

      - name: Clippy FFI bridge
        run: cargo clippy -p git-ai-ffi -- -D warnings
