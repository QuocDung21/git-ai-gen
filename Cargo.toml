[package]
name = "git-ai"
version = "3.0.0"
edition = "2021"

[lib]
name = "git_ai_core"
crate-type = ["staticlib", "rlib"]

[features]
default = ["tui"]
tui = []

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[dependencies]
clap = { version = "4.4", features = ["derive"] }
inquire = "0.7"
arboard = "3.3"
colored = "2.1"
crossterm = "0.27"
sys-locale = "0.3"
anyhow = "1.0.102"
console = "0.16.3"
indicatif = "0.18.4"
ratatui = "0.26"
rfd = "0.17.2"
serde_yaml = "0.9.34"
serde = { version = "1.0.228", features = ["derive"] }
dark-light = "2.0.0"
open = "5.3.5"
enigo = "0.2"
tempfile = "3.27.0"
chrono = "0.4.44"
cli-log = "2.1.0"
serde_json = "1.0.100"
